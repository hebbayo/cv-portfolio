# Copy to /etc/nginx/sites-available/portfolio on the server, then:
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file to add TLS:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# Replace yourdomain.com and /srv/portfolio throughout.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /srv/portfolio/frontend;

    # Admin image uploads. Django's default is 2.5M in memory; this is nginx's
    # own ceiling and it rejects with 413 before the request reaches gunicorn.
    client_max_body_size 10M;

    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/run/portfolio/gunicorn.sock;
    }

    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/portfolio/gunicorn.sock;
    }

    # collectstatic output: admin + DRF browsable API assets. Hashed names are
    # safe to cache hard.
    location /static/ {
        alias /srv/portfolio/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User uploads (Profile.avatar, Project.cover_image). Nothing in Django
    # serves these once DEBUG=False -- this block is the only thing that does.
    location /media/ {
        alias /srv/portfolio/media/;
        expires 7d;
        access_log off;
    }

    # The exported frontend. try_files falls back to index.html so "/" works
    # and any future client-side route does too.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or visitors keep an old page after a
    # deploy. The asset files it references can be.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
